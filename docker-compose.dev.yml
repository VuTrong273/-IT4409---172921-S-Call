# =====================================================================
# Chế độ LẬP TRÌNH (hot-reload) - chồng lên docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
#   Frontend (Vite)  : http://localhost:5173   <- mở bằng địa chỉ này khi dev (HMR)
#   Backend  (nodemon-style --watch) : http://localhost:3000/api/v1/health
#
# Sửa code trong ./backend và ./frontend là tự nạp lại, không cần build lại image.
# Khi dev, Vite thay nginx làm điểm vào và proxy /api, /ws, /avatars, /chat-files.
# Vì vậy PUBLIC_URL / MINIO_PUBLIC_URL phải là địa chỉ Vite (mặc định bên dưới).
# =====================================================================

services:
  backend:
    build:
      target: dev
    command: npm run dev
    environment:
      APP_ENV: development
      PUBLIC_URL: http://localhost:${FRONTEND_DEV_PORT:-5173}
      MINIO_PUBLIC_URL: http://localhost:${FRONTEND_DEV_PORT:-5173}
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  # nginx không dùng khi dev: thay bằng Vite dev server
  frontend:
    build:
      target: dev
    command: npm run dev
    depends_on:
      backend:
        condition: service_started
    environment:
      VITE_PROXY_TARGET: http://backend:3000
      VITE_MINIO_TARGET: http://minio:9000
      VITE_USE_POLLING: "true" # bind-mount trên Windows / macOS không phát sự kiện file => dùng polling
    ports: !override
      - "${FRONTEND_DEV_PORT:-5173}:5173"
    healthcheck:
      disable: true
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  backend_node_modules:
  frontend_node_modules: