# nginx phục vụ bản build của frontend VÀ làm reverse proxy cho toàn bộ hệ thống,
# nên chỉ cần công khai MỘT cổng / MỘT hostname (Cloudflare Tunnel trỏ vào frontend:80):
#   /                       -> file tĩnh React (SPA)
#   /api/                   -> backend:3000    (REST)
#   /ws                     -> backend:3000    (WebSocket / Signaling)
#   /avatars/, /chat-files/ -> minio:9000 (ảnh đại diện, tệp trong chat qua presigned URL)

# Docker DNS nội bộ. Dùng biến trong proxy_pass để nginx không chết khi một service chưa chạy lúc khởi động.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Sau Cloudflare Tunnel header X-Forwarded-Proto = https; truy cập trực tiếp thì dùng scheme thật
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tệp tối đa 20 MB (+ phần dư multipart)
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ----- REST API -----
    location /api/ {
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # ----- WebSocket / Signaling -----
    location /ws {
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ----- MinIO (presigned URL) -----
    # Host phải giữ nguyên đúng giá trị trình duyệt gửi vì chữ ký S3 (SigV4) có bao gồm header Host.
    location ~ ^/(avatars|chat-files)/ {
        set $minio http://minio:9000;
        proxy_pass $minio;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 0;
    }

    # ----- SPA -----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}